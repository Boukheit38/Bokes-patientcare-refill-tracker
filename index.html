<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PatientCare - Refill Management</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f5f9;
    margin: 0;
    padding: 20px;
    color: #263238;
}

.container {
    max-width: 1200px;
    margin: 20px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}

h1 {
    color: #087e8b;
    text-align: center;
}

h2 {
    color: #087e8b;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button, .reminder-link {
    display: inline-block;
    padding: 11px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    font-size: 14px;
}

.register-btn {
    width: 100%;
    margin-top: 20px;
    background: #087e8b;
    color: white;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin: 20px 0;
}

.card {
    padding: 15px;
    background: #e8f4f5;
    border-radius: 8px;
    text-align: center;
}

.card h3 {
    font-size: 28px;
    margin: 8px;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    min-width: 850px;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
}

th {
    background: #087e8b;
    color: white;
}

.overdue {
    color: #c0392b;
    font-weight: bold;
}

.due {
    color: #d97706;
    font-weight: bold;
}

.upcoming {
    color: #087e8b;
    font-weight: bold;
}

.later {
    color: #555;
}

.refilled {
    color: #16834a;
    font-weight: bold;
}

.whatsapp {
    background: #25D366;
    color: white;
    margin-bottom: 5px;
}

.sms {
    background: #2874A6;
    color: white;
    margin-bottom: 5px;
}

.refill-btn {
    background: #087e8b;
    color: white;
    margin-bottom: 5px;
}

.history-btn {
    background: #6c5ce7;
    color: white;
    margin-bottom: 5px;
}

.delete-btn {
    background: #c0392b;
    color: white;
}

#message {
    margin-top: 15px;
    color: green;
    font-weight: bold;
}

.action-buttons a,
.action-buttons button {
    display: block;
    width: 100%;
    margin-bottom: 6px;
}

.history-panel {
    display: none;
    background: #f0f5f9;
    padding: 15px;
    margin-top: 10px;
    border-radius: 8px;
}

.history-panel table {
    min-width: 400px;
}

.history-panel th {
    background: #526777;
}

@media(max-width: 600px) {

    .container {
        padding: 15px;
    }

    th, td {
        padding: 7px;
        font-size: 12px;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>PatientCare</h1>

<p>Patient Registration and Medication Refill Tracker</p>

<hr>

<h2>Register New Patient</h2>

<form id="patientForm">

<label>Patient ID</label>
<input type="text" id="patientId" required>

<label>Full Name</label>
<input type="text" id="fullName" required>

<label>Phone Number</label>
<input type="tel" id="phone" placeholder="0712345678" required>

<label>Medication Name</label>
<input type="text" id="medication" required>

<label>Number of Days Supplied</label>
<input type="number" id="days" min="1" step="1" required>

<label>Date Medication Was Supplied</label>
<input type="date" id="supplyDate" required>

<button type="submit" class="register-btn">
Register Patient
</button>

</form>

<div id="message" role="status"></div>

<hr>

<h2>Refill Alert Dashboard</h2>

<div class="cards">

<div class="card">
Due Today
<h3 id="dueToday">0</h3>
</div>

<div class="card">
Upcoming
<h3 id="upcoming">0</h3>
</div>

<div class="card">
Overdue
<h3 id="overdue">0</h3>
</div>

<div class="card">
Later
<h3 id="later">0</h3>
</div>

<div class="card">
Refilled
<h3 id="refilled">0</h3>
</div>

</div>

<hr>

<h2>Registered Patients</h2>

<p id="patientCount">Total Patients: 0</p>

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>Patient ID</th>
<th>Name</th>
<th>Medication</th>
<th>Days Supplied</th>
<th>Next Refill Date</th>
<th>Status</th>
<th>Reminders / Action</th>
</tr>
</thead>

<tbody id="patientList"></tbody>

</table>

</div>

</div>

<script>

// Load saved patients

let patients = JSON.parse(
    localStorage.getItem("patientCareRecords") || "[]"
);

const form = document.getElementById("patientForm");

const patientList = document.getElementById("patientList");

const message = document.getElementById("message");


// Get today's local date

function getTodayString() {

    const today = new Date();

    return today.getFullYear() + "-" +
        String(today.getMonth() + 1).padStart(2, "0") + "-" +
        String(today.getDate()).padStart(2, "0");

}


// Calculate refill date

function calculateRefillDate(supplyDate, days) {

    const date = new Date(supplyDate + "T12:00:00");

    date.setDate(date.getDate() + Number(days));

    return date;

}


// Format date

function formatDate(date) {

    return date.toLocaleDateString("en-GB");

}


// Get refill status

function getRefillStatus(patient, refillDate) {

    // Refilled only when manually confirmed today

    if (patient.lastRefillDate === getTodayString()) {

        return {
            name: "Refilled",
            className: "refilled"
        };

    }

    const today = new Date();

    today.setHours(0, 0, 0, 0);

    const refill = new Date(refillDate);

    refill.setHours(0, 0, 0, 0);

    const difference = Math.round(
        (refill - today) / (1000 * 60 * 60 * 24)
    );

    if (difference < 0) {

        return {
            name: "Overdue",
            className: "overdue"
        };

    }

    if (difference === 0) {

        return {
            name: "Due Today",
            className: "due"
        };

    }

    if (difference <= 7) {

        return {
            name: "Upcoming",
            className: "upcoming"
        };

    }

    return {
        name: "Later",
        className: "later"
    };

}


// Save patients

function savePatients() {

    localStorage.setItem(
        "patientCareRecords",
        JSON.stringify(patients)
    );

}


// Add table cell

function addCell(row, value, className = "") {

    const cell = document.createElement("td");

    cell.textContent = value;

    if (className) {
        cell.className = className;
    }

    row.appendChild(cell);

}


// MANUAL MEDICATION REFILL FUNCTION

function refillMedication(index) {

    const patient = patients[index];

    if (!confirm(
        "Confirm that " + patient.name +
        " has actually received the medication?"
    )) {

        return;

    }

    // Record date manually confirmed by staff

    const supplyDate = getTodayString();

    // Ensure refill history exists

    if (!Array.isArray(patient.history)) {

        patient.history = [];

        patient.history.push({

            supplyDate: patient.supplyDate,

            days: patient.days,

            refillDate: calculateRefillDate(
                patient.supplyDate,
                patient.days
            ).toISOString()

        });

    }

    // Calculate next refill date

    const nextRefill = calculateRefillDate(
        supplyDate,
        patient.days
    );

    // Record new medication supply

    patient.history.push({

        supplyDate: supplyDate,

        days: patient.days,

        refillDate: nextRefill.toISOString()

    });

    // Update current patient information

    patient.supplyDate = supplyDate;

    patient.refillDate = nextRefill.toISOString();

    patient.lastRefillDate = supplyDate;

    // Save updated records

    savePatients();

    // Refresh dashboard and patient table

    displayPatients();

    message.textContent =
        "Refill successfully recorded for " +
        patient.name +
        ". Next refill date: " +
        formatDate(nextRefill);

}


// Show refill history

function toggleHistory(index) {

    const panel = document.getElementById(
        "history-" + index
    );

    panel.style.display =
        panel.style.display === "block" ? "none" : "block";

}


// Display patients

function displayPatients() {

    patientList.innerHTML = "";

    let counts = {

        "Due Today": 0,
        "Upcoming": 0,
        "Overdue": 0,
        "Later": 0,
        "Refilled": 0

    };

    patients.forEach((patient, index) => {

        const refillDate = calculateRefillDate(
            patient.supplyDate,
            patient.days
        );

        const status = getRefillStatus(patient, refillDate);

        counts[status.name]++;


        const row = document.createElement("tr");

        addCell(row, patient.id);

        addCell(row, patient.name);

        addCell(row, patient.medication);

        addCell(row, patient.days + " days");

        addCell(row, formatDate(refillDate));

        addCell(row, status.name, status.className);


        const actionCell = document.createElement("td");

        const actionButtons = document.createElement("div");

        actionButtons.className = "action-buttons";


        // Format Kenyan phone numbers

        const phone = patient.phone.replace(/\D/g, "");

        let whatsappNumber = phone;

        if (phone.startsWith("0")) {

            whatsappNumber = "254" + phone.substring(1);

        } else if (
            phone.startsWith("7") || phone.startsWith("1")
        ) {

            whatsappNumber = "254" + phone;

        }


        // Reminder message

        const reminderMessage = encodeURIComponent(

            "Hello " + patient.name +

            ", this is a friendly reminder from PatientCare. " +

            "Your medication refill is due on " +

            formatDate(refillDate) +

            ". Please contact your healthcare provider. Thank you."

        );


        // WhatsApp button

        const whatsappButton = document.createElement("a");

        whatsappButton.textContent = "WhatsApp";

        whatsappButton.href =
            "https://wa.me/" + whatsappNumber +
            "?text=" + reminderMessage;

        whatsappButton.target = "_blank";

        whatsappButton.rel = "noopener noreferrer";

        whatsappButton.className =
            "reminder-link whatsapp";


        // SMS button

        const smsButton = document.createElement("a");

        smsButton.textContent = "SMS";

        smsButton.href =
            "sms:" + phone + "?body=" + reminderMessage;

        smsButton.className = "reminder-link sms";


        // Manual refill button

        const refillButton = document.createElement("button");

        refillButton.textContent =
            patient.lastRefillDate === getTodayString()
            ? "Refill Recorded Today"
            : "Medication Refilled";

        refillButton.className = "refill-btn";

        // Prevent duplicate refill confirmation on the same day

        refillButton.disabled =
            patient.lastRefillDate === getTodayString();

        if (refillButton.disabled) {

            refillButton.style.opacity = "0.6";

            refillButton.style.cursor = "not-allowed";

        }

        refillButton.addEventListener("click", function() {

            refillMedication(index);

        });


        // Refill history button

        const historyButton = document.createElement("button");

        historyButton.textContent = "Refill History";

        historyButton.className = "history-btn";

        historyButton.addEventListener("click", function() {

            toggleHistory(index);

        });


        // Delete button

        const deleteButton = document.createElement("button");

        deleteButton.textContent = "Delete";

        deleteButton.className = "delete-btn";

        deleteButton.addEventListener("click", function() {

            if (confirm("Delete this patient record?")) {

                patients.splice(index, 1);

                savePatients();

                displayPatients();

                message.textContent =
                    "Patient record deleted successfully.";

            }

        });


        // Append action buttons

        actionButtons.appendChild(whatsappButton);

        actionButtons.appendChild(smsButton);

        actionButtons.appendChild(refillButton);

        actionButtons.appendChild(historyButton);

        actionButtons.appendChild(deleteButton);


        actionCell.appendChild(actionButtons);

        row.appendChild(actionCell);

        patientList.appendChild(row);


        // Refill history section

        const historyRow = document.createElement("tr");

        const historyCell = document.createElement("td");

        historyCell.colSpan = 7;

        const historyPanel = document.createElement("div");

        historyPanel.id = "history-" + index;

        historyPanel.className = "history-panel";


        const historyTitle = document.createElement("h3");

        historyTitle.textContent =
            "Refill History - " + patient.name;

        historyPanel.appendChild(historyTitle);


        const historyTable = document.createElement("table");

        const historyHead = document.createElement("thead");

        const headRow = document.createElement("tr");


        [
            "Refill Number",
            "Supply Date",
            "Days Supplied",
            "Next Refill Date"
        ].forEach(function(title) {

            const th = document.createElement("th");

            th.textContent = title;

            headRow.appendChild(th);

        });


        historyHead.appendChild(headRow);

        historyTable.appendChild(historyHead);


        const historyBody = document.createElement("tbody");

        const historyRecords = Array.isArray(patient.history)
            ? patient.history
            : [{
                supplyDate: patient.supplyDate,
                days: patient.days,
                refillDate: refillDate.toISOString()
            }];


        historyRecords.forEach(function(record, historyIndex) {

            const historyRecordRow = document.createElement("tr");

            addCell(historyRecordRow, historyIndex + 1);

            addCell(
                historyRecordRow,
                formatDate(new Date(record.supplyDate + "T12:00:00"))
            );

            addCell(historyRecordRow, record.days + " days");

            addCell(
                historyRecordRow,
                formatDate(new Date(record.refillDate))
            );

            historyBody.appendChild(historyRecordRow);

        });


        historyTable.appendChild(historyBody);

        historyPanel.appendChild(historyTable);

        historyCell.appendChild(historyPanel);

        historyRow.appendChild(historyCell);

        patientList.appendChild(historyRow);

    });


    // Update dashboard

    document.getElementById("dueToday").textContent =
        counts["Due Today"];

    document.getElementById("upcoming").textContent =
        counts["Upcoming"];

    document.getElementById("overdue").textContent =
        counts["Overdue"];

    document.getElementById("later").textContent =
        counts["Later"];

    document.getElementById("refilled").textContent =
        counts["Refilled"];


    // Total patients

    document.getElementById("patientCount").textContent =
        "Total Patients: " + patients.length;

}


// Register new patient

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const patient = {

        id: document.getElementById("patientId").value.trim(),

        name: document.getElementById("fullName").value.trim(),

        phone: document.getElementById("phone").value.trim(),

        medication: document.getElementById("medication").value.trim(),

        days: Number(document.getElementById("days").value),

        supplyDate: document.getElementById("supplyDate").value,

        history: [],

        lastRefillDate: null

    };


    // Check duplicate Patient ID

    if (patients.some(p => p.id === patient.id)) {

        message.textContent =
            "This Patient ID already exists.";

        return;

    }


    // Validate number of days

    if (!Number.isInteger(patient.days) || patient.days < 1) {

        message.textContent =
            "Enter a valid number of days.";

        return;

    }


    // Validate Kenyan phone number

    if (!/^(?:0\d{9}|254\d{9}|\+254\d{9})$/.test(
        patient.phone.replace(/\s/g, "")
    )) {

        message.textContent =
            "Enter a valid Kenyan phone number.";

        return;

    }


    // Validate supply date

    if (!patient.supplyDate ||
        isNaN(new Date(patient.supplyDate + "T12:00:00").getTime())) {

        message.textContent =
            "Enter a valid medication supply date.";

        return;

    }


    // Calculate first refill date

    const refillDate = calculateRefillDate(
        patient.supplyDate,
        patient.days
    );

    patient.refillDate = refillDate.toISOString();


    // Save first supply in history

    patient.history.push({

        supplyDate: patient.supplyDate,

        days: patient.days,

        refillDate: patient.refillDate

    });


    // Add patient

    patients.push(patient);

    savePatients();

    displayPatients();

    message.textContent =
        "Patient registered successfully!";

    form.reset();

});


// Display saved patients when page loads

displayPatients();

</script>

</body>
</html>
